<div class="backdrop" (click)="close()"></div>

<div class="dialog dialog--projection" role="dialog" aria-modal="true" aria-labelledby="projection-title">
  <header class="dialog__header">
    <div>
      <p class="dialog__eyebrow">{{ unit().name }}</p>
      <h2 id="projection-title">{{ page() === 'plan' ? 'Projected Stats' : 'Projected Final Stats' }}</h2>
    </div>
    <button type="button" class="dialog__close" aria-label="Close" (click)="close()">
      &times;
    </button>
  </header>

  @if (!plannedSteps()) {
  <form class="plan" [hidden]="page() !== 'plan'" (submit)="$event.preventDefault(); submit()">
    @if (chapterPicker()) {
      <label class="field">
        <span class="field__label">Starting chapter</span>
        <select class="plan__select" [value]="chapter()?.chapter" (change)="chapterNumber.set(+$any($event.target).value)">
          @for (option of chapters(); track option.chapter) {
            <option [value]="option.chapter" [selected]="option.chapter === chapter()?.chapter">
              Chapter {{ option.chapter }} · Lv {{ option.level }} {{ option.className }}
            </option>
          }
        </select>
      </label>
    }

    <app-class-plan [unit]="unit()" [startLevel]="startLevel()" [joiningClassName]="chapter()?.className ?? null" />

    <footer class="dialog__footer">
      <button type="button" class="button" (click)="close()">Cancel</button>
      <button type="submit" class="button button--primary" [disabled]="!chapter()">Submit</button>
    </footer>
  </form>
  }

  @if (page() === 'results') {
    <div class="results">
      <label class="results__level">
        <span class="field__label">End level</span>
        <input
          type="range"
          [min]="startLevel()"
          [max]="maxLevel"
          [value]="endLevel()"
          aria-label="End level slider"
          (input)="setEndLevel($any($event.target).value)"
        />
        <input
          class="results__level-input"
          type="number"
          inputmode="numeric"
          [min]="startLevel()"
          [max]="maxLevel"
          [value]="endLevel()"
          aria-label="End level"
          (focus)="selectValue($event)"
          (change)="setEndLevel($any($event.target).value); $any($event.target).value = endLevel()"
        />
      </label>

      <ul class="results__stats">
        @for (row of projection(); track row.stat) {
          <li
            class="results__stat"
            [title]="'Levelled ' + fixed(row.base) + (row.bonus ? ' + class bonus ' + row.bonus : '') + (row.mountBonus ? ' + mount bonus ' + row.mountBonus : '')"
          >
            <span class="results__label">{{ row.label }}</span>
            <span class="results__value">{{ fixed(row.total) }}</span>
          </li>
        }
      </ul>

      <footer class="dialog__footer">
        <button type="button" class="button" (click)="goBack()">Back</button>
        <button type="button" class="button button--primary" (click)="close()">Done</button>
      </footer>
    </div>
  }
</div>
